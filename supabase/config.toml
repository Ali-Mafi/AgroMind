project_id = "agromind"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
# Free plan and its entitlements are versioned inside the first migration.
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/auth/callback?next=/reset-password"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_expiry = 3600

[auth.rate_limit]
email_sent = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

[auth.hook.send_email]
enabled = true
uri = "http://host.docker.internal:3000/api/auth-email"
secrets = "env(SUPABASE_AUTH_EMAIL_HOOK_SECRET)"
